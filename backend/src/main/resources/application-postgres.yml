# Activate with SPRING_PROFILES_ACTIVE=postgres when using Supabase/PostgreSQL.
# The database becomes the schema source of truth; Hibernate only validates it.
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:1}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT:30000}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    # Existing classroom databases were originally created by Hibernate. A
    # non-empty schema without Flyway history is stamped at V1 and then gets
    # hardening migrations; a clean schema runs V1 from scratch.
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    validate-migration-naming: true
