spring:
  profiles:
    default: local

  datasource:
    # The normal launcher supplies the Supabase URL. This file-backed H2 URL is
    # only a resilient local fallback, but unlike an in-memory database it does
    # not silently erase bookings whenever the backend restarts.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/goalzone;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:2}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:1}

  jpa:
    hibernate:
      # Local fallback data survives restarts. PostgreSQL overrides this to
      # `validate` in application-postgres.yml and is managed by Flyway.
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # The local fallback remains code-first. The PostgreSQL profile owns its
    # schema through db/migration/postgresql.
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

  mail:
    host: ${SMTP_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
    port: ${SMTP_PORT:${SPRING_MAIL_PORT:587}}
    username: ${SMTP_USER:${SPRING_MAIL_USERNAME:}}
    password: ${SMTP_PASS:${SPRING_MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${SMTP_SECURE:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
            required: ${SMTP_STARTTLS_REQUIRED:false}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:${FRONTEND_URL:http://localhost:5173}}
  upload:
    directory: ${APP_UPLOAD_DIRECTORY:./uploads}
  mail:
    from-email: ${FROM_EMAIL:${SMTP_USER:${SPRING_MAIL_USERNAME:}}}
    from-name: ${FROM_NAME:GoalZone}
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    env: ${PAYPAL_ENV:sandbox}
    currency: ${PAYPAL_CURRENCY:USD}
    mock-mode: ${PAYPAL_MOCK_MODE:false}
  gemini:
    # Keep the key in .env.local or the deployment's secret manager, never in Git.
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}

jwt:
  # A local fallback keeps development accounts usable. Set JWT_SECRET in every
  # shared, staging, or production environment.
  secret: ${JWT_SECRET:swp391_local_only_change_me_before_deployment}
  expiration: 86400000
